
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Médico</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            linear-gradient(135deg,#0f172a,#1e293b,#334155);
        }

        .login-container{
            width:400px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            box-shadow:
            0 8px 32px rgba(0,0,0,0.3);
            color:white;
        }

        .title{
            text-align:center;
            font-size:2rem;
            margin-bottom:10px;
            font-weight:bold;
        }

        .subtitle{
            text-align:center;
            opacity:0.8;
            margin-bottom:35px;
        }

        .input-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:0.95rem;
        }

        input{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,0.12);
            color:white;
            font-size:1rem;
        }

        input::placeholder{
            color:rgba(255,255,255,0.6);
        }

        .btn-login{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            cursor:pointer;
            font-size:1rem;
            font-weight:bold;
            margin-top:10px;
            background:#38bdf8;
            color:#0f172a;
            transition:0.2s;
        }

        .btn-login:hover{
            transform:translateY(-2px);
            background:#7dd3fc;
        }

        .footer{
            margin-top:25px;
            text-align:center;
            opacity:0.6;
            font-size:0.9rem;
        }

    </style>

</head>
<body>

    <div class="login-container">

        <div class="title">
            Consultorio Médico
        </div>

        <div class="subtitle">
            Sistema de gestión hospitalaria
        </div>

        <form method="post" action="/login">

            <div class="input-group">
                <label>Correo</label>

                <input
                    type="text"
                    name="nombreUsuario"
                    placeholder="doctor@gmail.com"
                    required>
            </div>

            <div class="input-group">
                <label>Contraseña</label>

                <input
                    type="password"
                    name="password"
                    placeholder="********"
                    required>
            </div>

            <button class="btn-login" type="submit">
                Iniciar Sesión
            </button>

        </form>

        <div class="footer">
            Proyecto ASP.NET + SQL Server
        </div>

    </div>

</body>
</html>
